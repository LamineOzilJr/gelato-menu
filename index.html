@font-face { font-family: 'Poppins'; font-style: normal; font-weight: 600; font-display: swap; src: url(/fonts/poppins-600.6a7f28c5a6.woff2) format('woff2'); }

:root {
  --bg: #0B0A08;
  --surface: #15130F;
  --surface-2: #1C1914;
  --gold: #C4A765;
  --gold-mid: #A68B4C;
  --gold-deep: #836F39;
  --ivory: #F3EEE3;
  --muted: #A39B8B;
  --line: rgba(196, 167, 101, .18);
  --line-strong: rgba(196, 167, 101, .36);
  --hair: rgba(243, 238, 227, .08);
  --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --sans: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --radius: 16px;
  --bar-h: 60px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --wide: 1040px;
  --narrow: 760px;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ivory);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
a, button { -webkit-tap-highlight-color: transparent; }
svg { display: block; flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 8px; }
.skip { position: absolute; left: 12px; top: -64px; z-index: 50; padding: 10px 16px; border-radius: 999px; background: var(--ivory); color: var(--bg); font-size: 13px; font-weight: 600; transition: top .2s; }
.skip:focus { top: calc(8px + var(--safe-top)); }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.art { display: block; }

/* ——— Barre du haut ——— */
.bar {
  position: sticky; top: 0; z-index: 20;
  padding-top: var(--safe-top);
  background: rgba(11, 10, 8, .9);
  -webkit-backdrop-filter: saturate(140%) blur(16px);
  backdrop-filter: saturate(140%) blur(16px);
  border-bottom: 1px solid var(--line);
}
.bar__inner {
  height: var(--bar-h); max-width: var(--wide); margin: 0 auto; padding: 0 10px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
}
.bar__start { justify-self: start; display: flex; align-items: center; }
.bar__end { justify-self: end; display: flex; align-items: center; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; transition: background-color .2s; }
.icon-btn:hover { background: rgba(243, 238, 227, .06); }
.back-btn { height: 44px; display: inline-flex; align-items: center; gap: 2px; padding: 0 12px 0 4px; border-radius: 22px; font-size: 13px; font-weight: 500; transition: background-color .2s; }
.back-btn:hover { background: rgba(243, 238, 227, .06); }
.back-btn .ico { color: var(--gold); stroke-width: 1.8; }
.brand { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 10px; border-radius: 10px; }
.brand__name { font-family: var(--serif); font-size: 21px; font-weight: 600; line-height: 1; letter-spacing: .24em; margin-right: -.24em; color: var(--gold); }
.brand__sub { font-size: 8px; font-weight: 500; line-height: 1; letter-spacing: .5em; margin-right: -.5em; color: var(--muted); }
.lang { display: flex; align-items: center; }
.lang button { width: 40px; height: 44px; font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--muted); transition: color .2s; }
.lang button span { padding-bottom: 3px; border-bottom: 1px solid transparent; transition: border-color .2s; }
.lang button:hover { color: var(--ivory); }
.lang button[aria-pressed="true"] { color: var(--gold); }
.lang button[aria-pressed="true"] span { border-bottom-color: var(--gold); }
.lang__sep { width: 1px; height: 14px; background: rgba(243, 238, 227, .22); }

/* ——— Rubriques (pastilles) ——— */
.chips { border-top: 1px solid var(--hair); }
.chips__track {
  position: relative; max-width: var(--narrow); margin: 0 auto; padding: 11px 16px;
  display: flex; gap: 8px; overflow-x: auto; overscroll-behavior-x: contain;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
}
.chips__track::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; height: 40px; padding: 0 16px; display: inline-flex; align-items: center;
  border: 1px solid rgba(243, 238, 227, .18); border-radius: 999px;
  font-size: 13px; font-weight: 500; white-space: nowrap;
  transition: background-color .2s, color .2s, border-color .2s;
}
.chip:hover { border-color: var(--line-strong); }
.chip[aria-current="page"] { background: var(--gold); border-color: var(--gold); color: var(--bg); }

/* ——— Contenu ——— */
main { max-width: var(--narrow); margin: 0 auto; padding-bottom: calc(8px + var(--safe-bottom)); }
body.is-home main { max-width: var(--wide); }
.view { animation: view-in .45s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes view-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
.rule { width: 56px; height: 2px; background: var(--gold-deep); }

/* Accueil */
.hero { padding: 34px 24px 32px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; border-bottom: 1px solid var(--line); }
.hero__art { height: 128px; width: auto; }
.hero .eyebrow { font-weight: 500; letter-spacing: .34em; margin-right: -.34em; }
.hero__title { font-family: var(--serif); font-size: clamp(50px, 14vw, 76px); font-weight: 600; line-height: 1; color: var(--gold); outline: none; }
.hero__intro { max-width: 300px; font-size: 13px; line-height: 1.6; color: var(--muted); }
.home-body { padding: 20px 20px 0; }
.search-cta {
  width: 100%; height: 52px; padding: 0 18px; display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface);
  font-size: 13.5px; color: var(--muted); transition: border-color .2s, background-color .2s;
}
.search-cta:hover { border-color: var(--gold); background: var(--surface-2); }
.search-cta .ico { width: 18px; height: 18px; color: var(--gold); stroke-width: 1.7; }
.index__group { padding-top: 30px; }
.group-label { display: flex; align-items: center; gap: 12px; padding-bottom: 4px; font-size: 11px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
.group-label::after { content: ""; flex: 1; height: 1px; background: rgba(196, 167, 101, .25); }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 2px; border-bottom: 1px solid var(--hair); transition: background-color .2s; }
.row:hover { background: rgba(243, 238, 227, .03); }
.row__num { width: 24px; flex-shrink: 0; font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--gold-mid); }
.row__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row__title { font-family: var(--serif); font-size: 22px; font-weight: 500; line-height: 1.2; }
.row__meta { font-size: 12px; color: var(--muted); }
.row .ico { width: 18px; height: 18px; color: var(--gold); transition: transform .2s; }
.row:hover .ico { transform: translateX(3px); }
.loc-card {
  margin-top: 32px; padding: 16px 18px; display: flex; align-items: center; gap: 14px;
  border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface);
  transition: border-color .2s, background-color .2s;
}
.loc-card:hover { border-color: var(--gold); background: var(--surface-2); }
.loc-card__icon { width: 44px; height: 44px; flex-shrink: 0; display: grid; place-items: center; border: 1px solid rgba(196, 167, 101, .4); border-radius: 50%; color: var(--gold); }
.loc-card__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.loc-card__title { font-family: var(--serif); font-size: 20px; font-weight: 500; line-height: 1.2; }
.loc-card__sub { font-size: 12px; color: var(--muted); }
.loc-card > .ico { width: 18px; height: 18px; color: var(--gold); }
.foot { padding: 28px 0 30px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.foot__note { font-size: 11px; letter-spacing: .06em; color: var(--muted); }
.share-btn { height: 44px; padding: 0 18px; display: inline-flex; align-items: center; gap: 10px; border: 1px solid rgba(243, 238, 227, .18); border-radius: 999px; font-size: 13px; font-weight: 500; transition: border-color .2s; }
.share-btn:hover { border-color: var(--gold); }
.share-btn .ico { width: 17px; height: 17px; color: var(--gold); }

/* Rubrique */
.sec-hero { position: relative; min-height: 172px; padding: 28px 20px 24px; border-bottom: 1px solid var(--line); }
.sec-hero__art { position: absolute; right: 16px; top: 22px; height: 128px; width: auto; max-width: 36%; object-fit: contain; object-position: right center; }
.sec-hero__text { position: relative; max-width: 62%; display: flex; flex-direction: column; gap: 10px; }
.sec-hero--plain .sec-hero__text { max-width: none; }
.sec-hero__title { font-family: var(--serif); font-size: clamp(38px, 10.5vw, 54px); font-weight: 600; line-height: 1.05; color: var(--gold); outline: none; }
.sec-hero .rule { width: 48px; }
.sec-hero__note { font-size: 13px; line-height: 1.55; color: var(--muted); }
.groups { padding: 0 20px; }
.grp { padding-top: 22px; }
.grp__title { display: flex; align-items: center; gap: 12px; padding-bottom: 4px; font-family: var(--serif); font-style: italic; font-size: 21px; font-weight: 500; line-height: 1.3; }
.grp__title::after { content: ""; flex: 1; height: 1px; background: rgba(196, 167, 101, .25); }
.cols-head { display: flex; align-items: center; gap: 8px; padding: 8px 0 2px; }
.cols-head__unit { flex: 1; font-size: 10px; letter-spacing: .12em; color: var(--muted); }
.cols-head__col { width: 64px; text-align: right; font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.item { display: flex; align-items: flex-start; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--hair); scroll-margin-top: 150px; }
.item__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.item__name { font-size: 14px; font-weight: 600; line-height: 1.35; letter-spacing: .04em; text-transform: uppercase; }
.item__desc { font-size: 12.5px; line-height: 1.5; color: var(--muted); }
.price { flex-shrink: 0; white-space: nowrap; font-size: 15px; font-weight: 600; line-height: 1.35; color: var(--gold); font-variant-numeric: tabular-nums; }
.price small { padding-left: 4px; font-size: 10px; font-weight: 500; letter-spacing: .06em; color: var(--muted); }
.prices { flex-shrink: 0; display: flex; gap: 8px; }
.prices .price { width: 64px; text-align: right; }
.item.is-flash { animation: flash 2.4s ease-out; }
@keyframes flash {
  0%, 30% { background: rgba(196, 167, 101, .16); box-shadow: -12px 0 0 rgba(196, 167, 101, .16), 12px 0 0 rgba(196, 167, 101, .16); }
  100% { background: transparent; box-shadow: -12px 0 0 transparent, 12px 0 0 transparent; }
}
.tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 0 4px; }
.tags li { padding: 7px 13px; border: 1px solid rgba(196, 167, 101, .32); border-radius: 999px; font-size: 12.5px; }
.pager { padding: 32px 20px 30px; display: flex; flex-direction: column; gap: 8px; }
.next-link {
  padding: 16px 20px; display: flex; align-items: center; gap: 14px;
  border: 1px solid rgba(196, 167, 101, .32); border-radius: var(--radius); background: var(--surface);
  transition: border-color .2s, background-color .2s;
}
.next-link:hover { border-color: var(--gold); background: var(--surface-2); }
.next-link__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.next-link__label { font-size: 10px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); }
.next-link__title { font-family: var(--serif); font-size: 22px; font-weight: 500; line-height: 1.2; }
.next-link .ico { width: 22px; height: 22px; color: var(--gold); transition: transform .2s; }
.next-link:hover .ico { transform: translateX(3px); }
.prev-link { align-self: flex-start; height: 44px; padding-right: 8px; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); transition: color .2s; }
.prev-link:hover { color: var(--ivory); }
.prev-link .ico { width: 18px; height: 18px; }

/* Recherche */
.search { padding: 20px 20px 30px; display: flex; flex-direction: column; gap: 18px; }
.search__title { font-family: var(--serif); font-size: 34px; font-weight: 600; line-height: 1.1; color: var(--gold); outline: none; }
.field {
  height: 54px; padding: 0 8px 0 18px; display: flex; align-items: center; gap: 10px;
  border: 1px solid rgba(196, 167, 101, .5); border-radius: 999px; background: var(--surface);
  transition: border-color .2s, box-shadow .2s;
}
.field:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(196, 167, 101, .2); }
.field > .ico { width: 18px; height: 18px; color: var(--gold); stroke-width: 1.7; }
.field input {
  flex: 1; min-width: 0; height: 44px; padding: 0; border: 0; background: transparent;
  color: var(--ivory); font-family: var(--sans); font-size: 16px; -webkit-appearance: none; appearance: none;
}
.field input::placeholder { color: #8E8676; }
.field input:focus { outline: none; }
.field input::-webkit-search-cancel-button { display: none; }
.clear-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: rgba(243, 238, 227, .08); transition: background-color .2s; }
.clear-btn:hover { background: rgba(243, 238, 227, .14); }
.clear-btn .ico { width: 14px; height: 14px; stroke-width: 2; }
.suggest { display: flex; flex-direction: column; gap: 12px; }
.suggest__list { display: flex; flex-wrap: wrap; gap: 8px; }
.suggest__list button { height: 40px; padding: 0 16px; border: 1px solid rgba(243, 238, 227, .18); border-radius: 999px; font-size: 13px; transition: border-color .2s; }
.suggest__list button:hover { border-color: var(--gold); }
.results__count { padding-bottom: 6px; font-size: 12px; color: var(--muted); }
.result { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--hair); transition: background-color .2s; }
.result:hover { background: rgba(243, 238, 227, .03); }
.result__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.result__name { font-size: 13.5px; font-weight: 600; line-height: 1.35; letter-spacing: .04em; text-transform: uppercase; }
.result__name mark { background: none; color: var(--gold); }
.result__where { font-size: 12px; color: var(--muted); }
.result .price { font-size: 14px; }
.result > .ico { width: 18px; height: 18px; color: var(--gold); }
.tags.is-flash { border-radius: 12px; }
.empty { padding: 26px 0; text-align: center; font-size: 13.5px; line-height: 1.6; color: var(--muted); }
.empty strong { display: block; margin-bottom: 4px; font-weight: 500; color: var(--ivory); }

/* Adresses */
.locs { padding: 18px 20px 0; display: flex; flex-direction: column; gap: 14px; }
.loc { padding: 18px; display: flex; flex-direction: column; gap: 14px; border: 1px solid rgba(196, 167, 101, .22); border-radius: var(--radius); background: var(--surface); }
.loc__head { display: flex; align-items: flex-start; gap: 12px; }
.loc__head .ico { margin-top: 3px; color: var(--gold); }
.loc__name { font-family: var(--serif); font-size: 22px; font-weight: 500; line-height: 1.2; }
.loc__place { margin-top: 3px; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
.loc__phones { display: flex; gap: 8px; }
.tel {
  flex: 1 1 0; min-width: 0; height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid rgba(196, 167, 101, .4); border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap;
  font-variant-numeric: tabular-nums; transition: background-color .2s, border-color .2s, color .2s;
}
.tel:hover { background: var(--gold); border-color: var(--gold); color: var(--bg); }
.tel .ico { width: 15px; height: 15px; color: var(--gold); transition: color .2s; }
.tel:hover .ico { color: var(--bg); }
.follow { padding: 30px 20px 30px; display: flex; flex-direction: column; gap: 2px; }
.follow .eyebrow { padding-bottom: 8px; }
.follow__link { height: 44px; display: flex; align-items: center; gap: 12px; font-size: 13.5px; }
.follow__link .ico { color: var(--gold); stroke-width: 1.5; }
a.follow__link:hover span { text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 4px; }

/* Bouton retour en haut + message */
.to-top {
  position: fixed; right: 16px; bottom: calc(16px + var(--safe-bottom)); z-index: 30;
  width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%;
  border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--gold);
  box-shadow: 0 10px 28px rgba(0, 0, 0, .5);
  opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .25s, transform .25s;
}
.to-top.is-on { opacity: 1; transform: none; pointer-events: auto; }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + var(--safe-bottom)); z-index: 40;
  padding: 11px 18px; border-radius: 999px; background: var(--ivory); color: var(--bg);
  font-size: 13px; font-weight: 500; box-shadow: 0 10px 28px rgba(0, 0, 0, .5);
  opacity: 0; transform: translate(-50%, 10px); pointer-events: none; transition: opacity .25s, transform .25s;
}
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }
.update {
  position: fixed; left: 16px; right: 16px; bottom: calc(16px + var(--safe-bottom)); z-index: 40;
  max-width: 440px; margin: 0 auto; padding: 8px 8px 8px 18px; display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-2);

  .index { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 40px; }

  var toast = document.getElementById('toast');
  var live = document.getElementById('live');

  function load(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } }
  function save(key, value) { try { window.localStorage.setItem(key, value); } catch (e) { /* stockage indisponible */ } }
  function detectLang() {
    var saved = load('aroma-lang');
    if (saved === 'fr' || saved === 'en') return saved;
    var nav = String(navigator.language || 'fr').toLowerCase();
    return nav.indexOf('en') === 0 ? 'en' : 'fr';
  }
  function T() { return UI[lang]; }
  function L(o) { return o == null ? '' : (typeof o === 'string' ? o : (o[lang] != null ? o[lang] : '')); }
  function both(o) { return o == null ? '' : (typeof o === 'string' ? o : (o.fr || '') + ' ' + (o.en || '')); }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function icon(name, cls) {
    return '<svg class="ico' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICONS[name] + '</svg>';
  }
  function art(name, cls, eager) {
    var a = ART[name];
    if (!a) return '';
    return '<img class="art ' + cls + '" src="' + a.src + '" width="' + a.w + '" height="' + a.h + '" alt="" decoding="async"' + (eager ? ' fetchpriority="high"' : '') + '>';
  }
  function stats(section) {
    var count = 0, min = Infinity;
    section.groups.forEach(function (gr) {
      (gr.items || []).forEach(function (it) {
        count += 1;
        if (!it.x) [].concat(it.p).forEach(function (v) { if (v < min) min = v; });
      });
    });
    return { count: count, min: min };
  }
  function sectionIndex(id) {
    for (var i = 0; i < MENU.length; i++) if (MENU[i].id === id) return i;
    return -1;
  }

  /* ================================================================
     Navigation
     ================================================================ */
  function parseRoute() {
    var h = String(location.hash || '').replace(/^#\/?/, '');
    try { h = decodeURIComponent(h); } catch (e) { /* ignore */ }
    var id = h.split('/')[0];
    if (!id) return { view: 'home', key: 'home' };
    if (id === 'recherche') return { view: 'search', key: 'search' };
    if (id === 'adresses') return { view: 'adresses', key: 'adresses' };
    var idx = sectionIndex(id);
    if (idx >= 0) return { view: 'section', idx: idx, key: 's:' + id };
    return { view: 'home', key: 'home' };
  }

  function go(path, opts) {
    opts = opts || {};
    var current = history.state || {};
    try { history.replaceState(Object.assign({}, current, { y: window.scrollY }), ''); } catch (e) { /* ignore */ }
    var state = { fromHome: !!opts.fromHome, fromSearch: !!opts.fromSearch };
    var url = '#/' + path;
    try {
      if (opts.replace) history.replaceState(state, '', url);
      else history.pushState(state, '', url);
    } catch (e) {
      if (opts.replace) location.replace(url); else location.hash = '/' + path;
      return;
    }
    userNavigated = true;
    render(true);
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[href^="#/"]') : null;
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    var path = a.getAttribute('href').slice(2);
    var route = parseRoute();
    if (a.hasAttribute('data-flash')) pendingFlash = a.getAttribute('data-flash');
    if (path === '' && route.view === 'home') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (a.getAttribute('data-nav') === 'replace') {
      var st = history.state || {};
      go(path, { replace: true, fromHome: st.fromHome, fromSearch: st.fromSearch });
    } else if (path === '' && (history.state || {}).fromHome && route.view !== 'home') {
      history.back();
    } else {
      go(path, { fromHome: route.view === 'home', fromSearch: route.view === 'search' });
    }
  });

  window.addEventListener('popstate', function () { userNavigated = true; render(false); });
  window.addEventListener('hashchange', function () {
    if (location.hash && location.hash.indexOf('#/') !== 0) return;
    userNavigated = true; render(false);
  });
  document.getElementById('skip').addEventListener('click', function (e) {
    e.preventDefault();
    try { main.focus({ preventScroll: true }); } catch (err) { main.focus(); }
    main.scrollIntoView();
  });

  /* ================================================================
     Rendu
     ================================================================ */
  function renderBar(route) {
    var t = T();
    if (route.view === 'home') {
      barStart.innerHTML = '<a class="icon-btn" href="#/recherche" aria-label="' + esc(t.search) + '">' + icon('search') + '</a>';
    } else {
      barStart.innerHTML = '<a class="back-btn" href="#/" aria-label="' + esc(t.home) + '">' + icon('back') + '<span>' + esc(t.back) + '</span></a>';
    }
    document.querySelectorAll('#langGroup button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang));
    });
    document.getElementById('langGroup').setAttribute('aria-label', t.lang);
    chips.setAttribute('aria-label', t.sections);
    toTop.setAttribute('aria-label', t.top);
    document.getElementById('skip').textContent = t.skip;

    if (route.view === 'section') {
      var cur = MENU[route.idx].id;
      chipsTrack.innerHTML = MENU.map(function (s) {
        return '<a class="chip" href="#/' + s.id + '" data-nav="replace"' + (s.id === cur ? ' aria-current="page"' : '') + '>' + esc(L(s.t)) + '</a>';
      }).join('');
      chips.hidden = false;
      centerChip();
    } else {
      chips.hidden = true;
      chipsTrack.innerHTML = '';
    }
  }

  function centerChip() {
    var el = chipsTrack.querySelector('[aria-current="page"]');
    if (!el) return;
    var left = el.offsetLeft - (chipsTrack.clientWidth - el.offsetWidth) / 2;
    chipsTrack.scrollLeft = Math.max(0, left);
  }

  function viewHome() {
    var t = T();
    var n = 0;
    var groups = GROUPS.map(function (g) {
      var rows = MENU.filter(function (s) { return s.g === g; }).map(function (s) {
        n += 1;
        var st = stats(s);
        return '<li><a class="row" href="#/' + s.id + '">' +
          '<span class="row__num" aria-hidden="true">' + (n < 10 ? '0' : '') + n + '</span>' +
          '<span class="row__text"><span class="row__title">' + esc(L(s.t)) + '</span>' +
          '<span class="row__meta">' + st.count + ' ' + t.items + ' · ' + t.from + ' ' + fmt(st.min) + ' FCFA</span></span>' +
          icon('next') + '</a></li>';
      }).join('');
      return '<section class="index__group" aria-labelledby="g-' + g + '"><h2 class="group-label" id="g-' + g + '">' + esc(t.groups[g]) + '</h2><ul>' + rows + '</ul></section>';
    }).join('');
    var canShare = /^https?:$/.test(location.protocol);
    return '<div class="view">' +
      '<header class="hero">' + art('gelato', 'hero__art', true) +
        '<p class="eyebrow">Aroma Gelato · Dakar</p>' +
        '<h1 class="hero__title" tabindex="-1">' + esc(t.title) + '</h1>' +
        '<span class="rule" aria-hidden="true"></span>' +
        '<p class="hero__intro">' + esc(t.intro) + '</p>' +
      '</header>' +
      '<div class="home-body">' +
        '<a class="search-cta" href="#/recherche">' + icon('search') + '<span>' + esc(t.searchCta) + '</span></a>' +
        '<div class="index">' + groups + '</div>' +
        '<a class="loc-card" href="#/adresses"><span class="loc-card__icon">' + icon('pin') + '</span>' +
          '<span class="loc-card__text"><span class="loc-card__title">' + esc(t.locations) + '</span><span class="loc-card__sub">' + esc(t.locationsSub) + '</span></span>' +
          icon('next') + '</a>' +
        '<footer class="foot"><p class="foot__note">' + esc(t.prices) + '</p>' +
          (canShare ? '<button type="button" class="share-btn" data-action="share">' + icon('share') + '<span>' + esc(t.share) + '</span></button>' : '') +
        '</footer>' +
      '</div>' +
    '</div>';
  }

  function priceHtml(it, gr) {
    if (Array.isArray(it.p)) {
      return '<div class="prices">' + it.p.map(function (v, k) {
        return '<span class="price"><span class="sr-only">' + esc(L(gr.cols[k])) + ' : </span>' + fmt(v) + '<span class="sr-only"> FCFA</span></span>';
      }).join('') + '</div>';
    }
    return '<span class="price">' + fmt(it.p) + '<small>FCFA</small></span>';
  }

  function viewSection(idx) {
    var t = T();
    var s = MENU[idx];
    var prev = MENU[idx - 1];
    var next = MENU[idx + 1];
    var groups = s.groups.map(function (gr, gi) {
      var h = '<div class="grp">';
      if (gr.t) h += '<h2 class="grp__title">' + esc(L(gr.t)) + '</h2>';
      if (gr.cols) {
        h += '<div class="cols-head" aria-hidden="true"><span class="cols-head__unit">FCFA</span>' +
          gr.cols.map(function (c) { return '<span class="cols-head__col">' + esc(L(c)) + '</span>'; }).join('') + '</div>';
      }
      if (gr.items) {
        h += '<ul>' + gr.items.map(function (it, ii) {
          var desc = L(it.d);
          return '<li class="item" id="' + s.id + '-' + gi + '-' + ii + '"><div class="item__text">' +
            '<h3 class="item__name">' + esc(L(it.n)) + '</h3>' +
            (desc ? '<p class="item__desc">' + esc(desc) + '</p>' : '') +
            '</div>' + priceHtml(it, gr) + '</li>';
        }).join('') + '</ul>';
      }
      if (gr.tags) h += '<ul class="tags" id="' + s.id + '-' + gi + '-tags">' + gr.tags[lang].map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
      return h + '</div>';
    }).join('');
    var num = (idx + 1 < 10 ? '0' : '') + (idx + 1);
    return '<div class="view">' +
      '<header class="sec-hero' + (s.art ? '' : ' sec-hero--plain') + '">' +
        (s.art ? art(s.art, 'sec-hero__art') : '') +
        '<div class="sec-hero__text">' +
          '<p class="eyebrow">' + num + ' · ' + esc(t.groups[s.g]) + '</p>' +
          '<h1 class="sec-hero__title" tabindex="-1">' + esc(L(s.t)) + '</h1>' +
          '<span class="rule" aria-hidden="true"></span>' +
          (s.note ? '<p class="sec-hero__note">' + esc(L(s.note)) + '</p>' : '') +
        '</div>' +
      '</header>' +
      '<div class="groups">' + groups + '</div>' +
      '<nav class="pager" aria-label="' + esc(t.pager) + '">' +
        (next ? '<a class="next-link" href="#/' + next.id + '" data-nav="replace"><span class="next-link__text"><span class="next-link__label">' + esc(t.next) + '</span><span class="next-link__title">' + esc(L(next.t)) + '</span></span>' + icon('arrow') + '</a>'
              : '<a class="next-link" href="#/adresses"><span class="next-link__text"><span class="next-link__label">Aroma Gelato</span><span class="next-link__title">' + esc(t.locations) + '</span></span>' + icon('arrow') + '</a>') +
        (prev ? '<a class="prev-link" href="#/' + prev.id + '" data-nav="replace">' + icon('back') + '<span>' + esc(t.prev) + ' · ' + esc(L(prev.t)) + '</span></a>' : '') +
      '</nav>' +
    '</div>';
  }

  function viewSearch() {
    var t = T();
    return '<div class="view search">' +
      '<h1 class="search__title" tabindex="-1">' + esc(t.searchTitle) + '</h1>' +
      '<div class="field">' + icon('search') +
        '<input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + esc(t.searchPh) + '" aria-label="' + esc(t.search) + '" value="' + esc(lastQuery) + '">' +
        '<button type="button" class="clear-btn" id="qClear" aria-label="' + esc(t.clear) + '"' + (lastQuery ? '' : ' hidden') + '>' + icon('close') + '</button>' +
      '</div>' +
      '<div id="results"></div>' +
    '</div>';
  }

  function searchResults(q) {
    var t = T();
    var nq = norm(q.trim());
    if (!nq) {
      return '<div class="suggest"><p class="eyebrow">' + esc(t.suggest) + '</p><div class="suggest__list">' +
        SUGGESTIONS.map(function (w) { return '<button type="button" data-suggest="' + esc(w) + '">' + esc(w) + '</button>'; }).join('') +
        '</div></div>';
    }
    var out = [];
    MENU.forEach(function (s) {
      s.groups.forEach(function (gr, gi) {
        (gr.items || []).forEach(function (it, ii) {
          var hay = norm([both(s.t), both(gr.t), both(it.n), both(it.d)].join(' '));
          if (hay.indexOf(nq) === -1) return;
          var name = L(it.n);
          var at = norm(name).indexOf(nq);
          var nameHtml = at >= 0
            ? esc(name.slice(0, at)) + '<mark>' + esc(name.slice(at, at + nq.length)) + '</mark>' + esc(name.slice(at + nq.length))
            : esc(name);
          var price = Array.isArray(it.p) ? it.p.map(fmt).join(' / ') : fmt(it.p);
          out.push('<li><a class="result" href="#/' + s.id + '" data-flash="' + s.id + '-' + gi + '-' + ii + '">' +
            '<span class="result__text"><span class="result__name">' + nameHtml + '</span>' +
            '<span class="result__where">' + esc(L(s.t)) + (gr.t ? ' · ' + esc(L(gr.t)) : '') + '</span></span>' +
            '<span class="price">' + price + '<small>FCFA</small></span></a></li>');
        });
        if (gr.tags) {
          gr.tags.fr.forEach(function (tag, k) {
            if (norm(tag + ' ' + (gr.tags.en[k] || '')).indexOf(nq) === -1) return;
            var name = gr.tags[lang][k];
            var at = norm(name).indexOf(nq);
            var nameHtml = at >= 0
              ? esc(name.slice(0, at)) + '<mark>' + esc(name.slice(at, at + nq.length)) + '</mark>' + esc(name.slice(at + nq.length))
              : esc(name);
            out.push('<li><a class="result" href="#/' + s.id + '" data-flash="' + s.id + '-' + gi + '-tags">' +
              '<span class="result__text"><span class="result__name">' + nameHtml + '</span>' +
              '<span class="result__where">' + esc(L(s.t)) + (gr.t ? ' · ' + esc(L(gr.t)) : '') + '</span></span>' +
              icon('next') + '</a></li>');
          });
        }
      });
    });
    if (!out.length) {
      return '<p class="empty"><strong>' + esc(t.none) + ' « ' + esc(q.trim()) + ' »</strong>' + esc(t.noneHint) + '</p>';
    }
    return '<p class="results__count">' + out.length + ' ' + (out.length === 1 ? t.one : t.many) + '</p><ul>' + out.join('') + '</ul>';
  }

  function updateResults() {
    var box = document.getElementById('results');
    if (!box) return;
    box.innerHTML = searchResults(lastQuery);
    var clear = document.getElementById('qClear');
    if (clear) clear.hidden = !lastQuery;
    var nq = lastQuery.trim();
    var count = box.querySelectorAll('.result').length;
    live.textContent = nq ? count + ' ' + (count === 1 ? T().one : T().many) : '';
  }

  function viewAdresses() {
    var t = T();
    var cards = LOCATIONS.map(function (l) {
      return '<li class="loc"><div class="loc__head">' + icon('pin') + '<div>' +
        '<h2 class="loc__name">' + esc(l.name) + '</h2>' +
        (l.place ? '<p class="loc__place">' + esc(L(l.place)) + '</p>' : '') +
        '</div></div><div class="loc__phones">' +
        l.phones.map(function (p) {
          return '<a class="tel" href="tel:+221' + p.replace(/\s/g, '') + '" aria-label="' + esc(t.call + ' ' + l.name + ', ' + p) + '">' + icon('phone') + '<span>' + esc(p) + '</span></a>';
        }).join('') +
        '</div></li>';
    }).join('');
    return '<div class="view">' +
      '<header class="sec-hero sec-hero--plain"><div class="sec-hero__text">' +
        '<p class="eyebrow">Aroma Gelato</p>' +
        '<h1 class="sec-hero__title" tabindex="-1">' + esc(t.locations) + '</h1>' +
        '<span class="rule" aria-hidden="true"></span>' +
        '<p class="sec-hero__note">' + esc(t.tapToCall) + '</p>' +
      '</div></header>' +
      '<ul class="locs">' + cards + '</ul>' +
      '<div class="follow"><p class="eyebrow">' + esc(t.follow) + '</p>' +
        '<a class="follow__link" href="https://www.aromagelato.it" target="_blank" rel="noopener">' + icon('globe') + '<span>www.aromagelato.it</span></a>' +
        '<a class="follow__link" href="https://www.instagram.com/aromagelatosenegal/" target="_blank" rel="noopener">' + icon('instagram') + '<span>@aromagelatosenegal</span></a>' +
        '<p class="follow__link">' + icon('facebook') + '<span>Aroma Gelato Dakar</span></p>' +
      '</div>' +
    '</div>';
  }

  function render(fromClick) {
    var route = parseRoute();
    var t = T();
    var sameView = route.key === lastKey;
    document.documentElement.lang = lang;
    document.body.classList.toggle('is-home', route.view === 'home');
    renderBar(route);

    if (!sameView || fromClick === 'lang') {
      if (route.view === 'home') main.innerHTML = viewHome();
      else if (route.view === 'section') main.innerHTML = viewSection(route.idx);
      else if (route.view === 'search') main.innerHTML = viewSearch();
      else main.innerHTML = viewAdresses();
    }
    if (route.view === 'search') {
      updateResults();
      var input = document.getElementById('q');
      if (input && !sameView && fromClick === true) { try { input.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
    }

    document.title = route.view === 'section' ? L(MENU[route.idx].t) + ' — Aroma Gelato'
      : route.view === 'search' ? t.searchTitle + ' — Aroma Gelato'
      : route.view === 'adresses' ? t.locations + ' — Aroma Gelato'
      : t.docTitle;

    if (fromClick !== 'lang' && !sameView) {
      var y = (history.state && typeof history.state.y === 'number' && fromClick === false) ? history.state.y : 0;
      window.scrollTo(0, y);
      if (userNavigated) {
        var h1 = main.querySelector('h1');
        if (h1 && route.view !== 'search') { try { h1.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
      }
    }
    lastKey = route.key;

    if (pendingFlash) {
      var target = document.getElementById(pendingFlash);
      pendingFlash = null;
      if (target) {
        requestAnimationFrame(function () {
          target.scrollIntoView({ block: 'center', behavior: 'smooth' });
          target.classList.remove('is-flash');
          void target.offsetWidth;
          target.classList.add('is-flash');
        });
      }
    }
    updateToTop();
  }

  /* ================================================================
     Interactions
     ================================================================ */
  document.getElementById('langGroup').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lang]');
    if (!b) return;
    var next = b.getAttribute('data-lang');
    if (next === lang) return;
    lang = next;
    save('aroma-lang', lang);
    render('lang');
    if (!updateBox.hidden) showUpdate();
  });

  main.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'q') { lastQuery = e.target.value; updateResults(); }
  });

  main.addEventListener('click', function (e) {
    var sug = e.target.closest('[data-suggest]');
    if (sug) {
      lastQuery = sug.getAttribute('data-suggest');
      var input = document.getElementById('q');
      if (input) input.value = lastQuery;
      updateResults();
      return;
    }
    if (e.target.closest('#qClear')) {
      lastQuery = '';
      var q = document.getElementById('q');
      if (q) { q.value = ''; q.focus(); }
      updateResults();
      return;
    }
    if (e.target.closest('[data-action="share"]')) share();
  });

  main.addEventListener('keydown', function (e) {
    if (e.target && e.target.id === 'q' && e.key === 'Enter') {
      e.preventDefault();
      var first = document.querySelector('#results .result');
      if (first) first.click();
    }
  });

  function share() {
    var t = T();
    var url = location.href.split('#')[0];
    if (navigator.share) {
      navigator.share({ title: t.docTitle, url: url }).catch(function () { /* partage annulé */ });
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { showToast(t.copied); }, function () { /* ignore */ });
    }
  }

  var toastTimer = null;
  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('is-on'); }, 2200);
  }

  function updateToTop() {
    toTop.classList.toggle('is-on', window.scrollY > 700);
  }
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { updateToTop(); ticking = false; });
  }, { passive: true });
  toTop.addEventListener('click', function () {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    var h1 = main.querySelector('h1');
    if (h1) { try { h1.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
  });
  window.addEventListener('resize', centerChip);

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  render(null);

  /* Mise en cache : affichage instantané aux visites suivantes, même hors connexion. */
  var updateBox = document.getElementById('update');
  function showUpdate() {
    var t = T();
    document.getElementById('updateText').textContent = t.updated;
    document.getElementById('updateBtn').textContent = t.refresh;
    updateBox.hidden = false;
    document.body.classList.add('has-update');
  }
  document.getElementById('updateBtn').addEventListener('click', function () { location.reload(); });
  var secure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if ('serviceWorker' in navigator && secure) {
    navigator.serviceWorker.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'menu-updated') showUpdate();
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () { /* navigateur non compatible */ });
    });
  }
})();
</script>
</body>
</html>
